<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{page_title}}</title>
  <link rel="stylesheet" href="{{base_css}}">
  <link rel="stylesheet" href="{{page_css}}">
</head>
<body>
  <header class="site-header">
    <div class="container inner">
      <a class="brand" href="/script/index.php?page=home">Yum Yum App</a>
      <nav class="nav-links">{{nav_links}}</nav>
    </div>
  </header>
  {{flash_message}}
  <main class="page-shell">
    <section class="container">
      <h1>Recipe matches</h1>
      <p>Recipes are loaded by PHP-backed API data, while this HTML stays in the template folder.</p>
      <div class="recipes-toolbar">
        <input id="recipe-search" class="input" type="search" placeholder="Search recipes...">
      </div>
      <div id="recipe-grid" class="recipe-grid"></div>
    </section>
  </main>
  <script defer src="{{page_js}}"></script>
</body>
</html>
